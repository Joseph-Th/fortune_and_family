# Solo-dev fast iteration — minimal config, maximal reuse.
# No remote cache, no wrappers, no custom linker.
# Every profile keeps `incremental = true` + 16 codegen units + pipelining.
# `profile.check` inherits `dev` so `cargo check` and `cargo test` share
# the same incremental cache; `cargo clippy` and `cargo test --doc` reuse it
# too. With a single 106k-line crate, incremental touches still recompile
# dependent modules: expect ~4-5s after a lib-file edit, <1s when cached.
# Full budgets (warm, after one-time cold of clippy ~12s / release ~56s):
# check 0.3s | fast-filter 1-2s | fast 2-3s (980 tests) | standard 5-7s
# (lib + docs + one debug CLI) | debug playtest <1s | gameplay ~16s.
[build]
# Pipelining lets Cargo start compiling dependents before dependencies finish,
# shaving wall time on warm incremental builds without extra configuration.
pipelining = true
# Incremental is set in Cargo.toml profiles; this keeps `cargo check` and
# `cargo clippy` warm for sub-second editor feedback as well.
incremental = true
# Unset so Cargo defaults to all logical cores. Caps are opt-in:
# `CIVIC_DYNASTY_JOBS=4` limits both `cargo --jobs` and the harness campaign
# fan-out without editing this file. The harness reads the same variable at
# runtime to avoid oversubscribing a busy machine. Single-threaded harnesses
# (playtest with one campaign) stay serial and only parallelize candidate
# probes when worthwhile.
