name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Shell syntax
        run: bash -n scripts/test.sh scripts/verify_cli.sh
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --all-targets --locked
      - name: Fast tests
        run: bash scripts/test.sh fast
      - name: Soak tests
        run: bash scripts/test.sh soak
      - name: CLI smoke test
        run: bash scripts/verify_cli.sh
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked
