name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve pinned Rust toolchain
        run: rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - name: Fast verification lane
        run: bash scripts/test.sh ci-verify

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve pinned Rust toolchain
        run: rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - name: Deep gates lane
        run: bash scripts/test.sh ci-gates
