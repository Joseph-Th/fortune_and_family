[package]
name = "civic-dynasty"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
description = "A deterministic dynasty, political-economy, and civic strategy simulation"
license = "MIT"

[package.metadata.git-wizard.validation]
quick = "bash scripts/test.sh quick"
standard = "bash scripts/test.sh standard"
full = "bash scripts/test.sh all"

[lib]
name = "civic_dynasty"
path = "src/lib.rs"

[[bin]]
name = "civic-dynasty"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"

# Solo-dev tuning: every profile keeps `incremental = true` + 16 codegen
# units + `pipelining = true` (.cargo/config.toml). `dev`/`test` share
# `opt-level 1` (deps at 2) so 980 tests finish ~1.5s exec, filtered domains
# ~0.1s. `cargo check` shares the dev cache warm. Single-crate incremental
# still recompiles dependents: ~4s after a lib edit, <1s when fully cached.
# One-time cold costs: clippy ~12s, release ~56s. `release` is the harness
# profile — full opt without LTO, warm ~1s, within ~10% of peak throughput.
# Use `release-max` only when peak throughput itself is measured.
[profile.dev]
opt-level = 1
debug = 1
incremental = true
codegen-units = 16
split-debuginfo = "off"

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1
debug = 1
incremental = true
codegen-units = 16
split-debuginfo = "off"

[profile.test.package."*"]
opt-level = 2

# Release is the everyday harness profile: full opt, 16 codegen units,
# incremental, no LTO. Warm rebuild ~1s; throughput within ~10% of
# release-max. All gameplay output is identical.
[profile.release]
opt-level = 3
codegen-units = 16
incremental = true
debug = 0
lto = false

[profile.release.package."*"]
opt-level = 3

# Deliberate throughput-evidence profile: serialized single-unit codegen plus
# thin-LTO for the smallest, fastest binaries. Build it explicitly
# (`cargo build --profile release-max`) when peak performance itself is the
# thing being measured; routine verification does not need it.
[profile.release-max]
inherits = "release"
lto = "thin"
codegen-units = 1
incremental = false

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
