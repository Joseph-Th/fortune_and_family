[package]
name = "civic-dynasty"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
description = "A deterministic dynasty, political-economy, and civic strategy simulation"
license = "MIT"

[lib]
name = "civic_dynasty"
path = "src/lib.rs"

[[bin]]
name = "civic-dynasty"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"

[profile.dev]
debug = 1
incremental = true
codegen-units = 16

[profile.dev.package."*"]
opt-level = 2

[profile.test]
debug = 1
incremental = true
codegen-units = 16

[profile.test.package."*"]
opt-level = 2

[profile.release]
incremental = true

# Fast iteration: prefer quick compile over peak runtime
[profile.quick]
inherits = "dev"
incremental = true
codegen-units = 16

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
